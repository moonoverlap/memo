<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>포켓 메모 PC 로그인</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --line:#E1E6F0; --ink:#121826; --muted:#5B6680;
  --accent:#295BFF; --danger:#D43A40; --ok:#17935F;
  --font:"Pretendard Variable","Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:grid;place-items:center;padding:16px;-webkit-font-smoothing:antialiased}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;box-shadow:0 10px 30px rgba(18,24,38,.07)}
.card img{border-radius:12px}
h1{margin:4px 0 0;font-size:20px;letter-spacing:-.02em;line-height:1.35}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.google{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.google:hover{background:#EAEEF7}
.google:disabled{opacity:.5;cursor:default}
.google:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--danger);font-size:13.5px}
.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main class="card">
  <img src="icon-192.png" width="52" height="52" alt="">
  <h1>포켓 메모 PC 프로그램 로그인</h1>
  <p id="lead">Google 계정을 고르면 로그인 정보가 PC 프로그램으로 넘어가요. 이 브라우저에는 로그인 상태가 남지 않아요.</p>
  <button class="google" id="go" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Google로 로그인
  </button>
  <p class="msg" id="msg" role="alert"></p>
  <form id="back" method="post" hidden>
    <input type="hidden" name="state" id="fState">
    <input type="hidden" name="idToken" id="fId">
    <input type="hidden" name="accessToken" id="fAccess">
  </form>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(() => {
  'use strict';
  const CFG = {
    apiKey: 'AIzaSyAdDMvFVdoLm2-VAP3dsdoR-_FXyIkrnpI',
    authDomain: 'pocket-memo-c13cc.firebaseapp.com',
    projectId: 'pocket-memo-c13cc',
    appId: '1:826301001058:web:0eb7fd9a3b811a7528903b',
  };
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const port = q.get('port') || '';
  const state = q.get('state') || '';
  const valid = /^\d{4,5}$/.test(port) && Number(port) > 1023 && Number(port) < 65536 && /^[A-Za-z0-9_-]{16,128}$/.test(state);

  if (!valid) {
    $('go').disabled = true;
    $('msg').textContent = 'PC 프로그램의 [Google로 로그인] 버튼으로 이 페이지를 열어 주세요.';
    return;
  }
  if (!window.firebase) {
    $('go').disabled = true;
    $('msg').textContent = '로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
    return;
  }
  // 이 페이지는 로그인 상태를 저장하지 않음 (같은 주소의 웹앱 로그인에 영향 없음)
  const app = firebase.initializeApp(CFG, 'desktop-login');
  const auth = app.auth();

  $('go').addEventListener('click', async () => {
    $('msg').textContent = '';
    $('go').disabled = true;
    try {
      await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
      const p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      const r = await auth.signInWithPopup(p);
      const c = r && r.credential;
      if (!c || !c.idToken) throw { code: 'no-token' };
      $('lead').textContent = '포켓 메모 PC 프로그램으로 넘기는 중이에요…';
      const f = $('back');
      f.action = 'http://127.0.0.1:' + port + '/callback';
      $('fState').value = state;
      $('fId').value = c.idToken;
      $('fAccess').value = c.accessToken || '';
      await auth.signOut().catch(() => {});
      f.submit();
    } catch (e) {
      const code = (e && e.code) || '';
      $('msg').textContent = code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'
        ? '로그인 창을 닫았어요. 다시 눌러 주세요.'
        : code === 'auth/popup-blocked'
          ? '팝업이 막혔어요. 주소창 오른쪽에서 팝업을 허용한 뒤 다시 눌러 주세요.'
          : 'Google 로그인을 마치지 못했어요. (' + (code || '알 수 없는 오류') + ')';
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
